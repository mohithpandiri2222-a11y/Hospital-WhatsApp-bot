<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — City Hospital</title>
<link rel="stylesheet" href="{{ url_for('admin.static', filename='css/admin.css') }}">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo" style="display: flex; flex-direction: column; align-items: center;">
      <span class="hospital-icon" style="margin-bottom: 8px;"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-hospital"><path d="M12 6v4"/><path d="M14 14h-4v4"/><path d="M14 18h-4"/><path d="M14 8h-4"/><path d="M18 12h2v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-4h2"/><path d="M6 12V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v6"/></svg></span>
      <h1>City Hospital</h1>
      <p>Admin Dashboard</p>
    </div>
    {% if error %}
      <div class="login-error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="{{ url_for('admin.login') }}">
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter admin password" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary">Login</button>
    </form>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — City Hospital</title>
<link rel="stylesheet" href="{{ url_for('admin.static', filename='css/admin.css') }}">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <span class="hospital-icon">🏥</span>
      <h1>City Hospital</h1>
      <p>Admin Dashboard</p>
    </div>
    {% if error %}
      <div class="login-error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="{{ url_for('admin.login') }}">
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter admin password" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary">Login</button>
    </form>
  </div>
</div>
</body>
</html>
